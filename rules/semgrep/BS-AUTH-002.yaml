rules:
  - id: BS-AUTH-002
    message: >
      Auth endpoint does not have rate-limit middleware applied before the handler.
      Auth endpoints without rate limiting are vulnerable to brute-force and
      credential-stuffing attacks.
    severity: WARNING
    metadata:
      category: auth-access-control
      confidence: MEDIUM
      bs-rule-id: BS-AUTH-002
      bs-vuln-class: auth-access-control
      bs-base-severity: medium
      references:
        - https://owasp.org/www-project-top-ten/2017/A2_2017-Broken_Authentication
    languages:
      - javascript
      - typescript
    pattern-either:
      - pattern: "$ROUTER.post('/login', $HANDLER)"
      - pattern: "$ROUTER.post('/register', $HANDLER)"
      - pattern: "$ROUTER.post('/reset', $HANDLER)"
      - pattern: "$ROUTER.post('/forgot-password', $HANDLER)"
      - pattern: "$ROUTER.post('/api/auth/login', $HANDLER)"
      - pattern: "$ROUTER.post('/api/auth/register', $HANDLER)"
      - pattern: "$ROUTER.post('/api/auth/reset', $HANDLER)"
      - pattern: "$ROUTER.post('/api/login', $HANDLER)"
      - pattern: "$ROUTER.post('/api/register', $HANDLER)"
      - pattern: '$ROUTER.post("/login", $HANDLER)'
      - pattern: '$ROUTER.post("/register", $HANDLER)'
      - pattern: '$ROUTER.post("/reset", $HANDLER)'
      - pattern: '$ROUTER.post("/api/auth/reset", $HANDLER)'
      - pattern: '$ROUTER.post("/api/login", $HANDLER)'
