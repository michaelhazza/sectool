rules:
  - id: BS-JWT-001-algorithm
    message: >
      JWT sign or verify call does not pin the algorithm. Without an explicit
      algorithm the library may accept the "none" algorithm. Always specify
      algorithm on sign and verify.
    severity: ERROR
    metadata:
      category: auth-access-control
      confidence: MEDIUM
      bs-rule-id: BS-JWT-001
      bs-vuln-class: auth-access-control
      bs-base-severity: high
      references:
        - https://owasp.org/www-project-top-ten/2017/A2_2017-Broken_Authentication
    languages:
      - javascript
      - typescript
    pattern-either:
      - pattern: jwt.sign($PAYLOAD, $SECRET)
      - pattern: jwt.verify($TOKEN, $SECRET)

  - id: BS-JWT-001-expiry
    message: >
      JWT sign sets algorithm but no expiry (expiresIn). Tokens without expiry
      remain valid indefinitely and cannot be invalidated after a compromise.
    severity: ERROR
    metadata:
      category: auth-access-control
      confidence: MEDIUM
      bs-rule-id: BS-JWT-001
      bs-vuln-class: auth-access-control
      bs-base-severity: high
      references:
        - https://owasp.org/www-project-top-ten/2017/A2_2017-Broken_Authentication
    languages:
      - javascript
      - typescript
    patterns:
      - pattern: |
          jwt.sign($PAYLOAD, $SECRET, {algorithm: $ALG})
      - pattern-not: |
          jwt.sign($PAYLOAD, $SECRET, {expiresIn: $EXP})

  - id: BS-JWT-001-literal-secret
    message: >
      JWT secret is a string literal rather than an environment variable.
      Hard-coded secrets cannot be rotated and are trivially leaked.
    severity: ERROR
    metadata:
      category: secrets
      confidence: HIGH
      bs-rule-id: BS-JWT-001
      bs-vuln-class: secrets
      bs-base-severity: high
      references:
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_credentials
    languages:
      - javascript
      - typescript
    pattern-either:
      - pattern: 'jwt.sign($PAYLOAD, "...", ...)'
      - pattern: 'jwt.verify($TOKEN, "...", ...)'
