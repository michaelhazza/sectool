rules:
  - id: BS-UPLOAD-001-no-size-limit
    message: >
      multer upload has no file-size limit. Without limits.fileSize an attacker
      can upload arbitrarily large files, exhausting disk space or memory.
    severity: WARNING
    metadata:
      category: misconfiguration
      confidence: MEDIUM
      bs-rule-id: BS-UPLOAD-001
      bs-vuln-class: misconfiguration
      bs-base-severity: medium
      references:
        - https://owasp.org/www-community/vulnerabilities/Unrestricted_File_Upload
    languages:
      - javascript
      - typescript
    patterns:
      - pattern: |
          multer({dest: $DEST})
      - pattern-not: |
          multer({dest: $DEST, limits: $LIMITS})
      - pattern-not: 'multer({fileFilter: $F})'

  - id: BS-UPLOAD-001-no-type-filter
    message: >
      multer upload has no file-type filter. Without fileFilter any file type
      including server-side scripts may be uploaded.
    severity: WARNING
    metadata:
      category: misconfiguration
      confidence: MEDIUM
      bs-rule-id: BS-UPLOAD-001
      bs-vuln-class: misconfiguration
      bs-base-severity: medium
      references:
        - https://owasp.org/www-community/vulnerabilities/Unrestricted_File_Upload
    languages:
      - javascript
      - typescript
    patterns:
      - pattern: |
          multer({dest: $DEST, limits: $LIMITS})
      - pattern-not: 'multer({fileFilter: $F})'
