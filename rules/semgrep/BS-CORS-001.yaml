rules:
  - id: BS-CORS-001-wildcard-header
    message: >
      CORS is configured with a wildcard origin. A wildcard policy allows any
      origin to make cross-site requests, exposing sensitive API responses.
    severity: ERROR
    metadata:
      category: misconfiguration
      confidence: HIGH
      bs-rule-id: BS-CORS-001
      bs-vuln-class: misconfiguration
      bs-base-severity: high
      references:
        - https://owasp.org/www-community/attacks/CORS_OriginHeaderScrutiny
    languages:
      - javascript
      - typescript
    pattern-either:
      - pattern: |
          $RES.setHeader("Access-Control-Allow-Origin", "*")
      - pattern: |
          $RES.header("Access-Control-Allow-Origin", "*")
      - pattern: |
          $RES.set("Access-Control-Allow-Origin", "*")

  - id: BS-CORS-001-cors-wildcard
    message: >
      cors() middleware configured with wildcard origin allows any site to
      make credentialed cross-site requests.
    severity: ERROR
    metadata:
      category: misconfiguration
      confidence: HIGH
      bs-rule-id: BS-CORS-001
      bs-vuln-class: misconfiguration
      bs-base-severity: high
      references:
        - https://owasp.org/www-community/attacks/CORS_OriginHeaderScrutiny
    languages:
      - javascript
      - typescript
    pattern: 'cors("*")'
