name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint + typecheck + test + benchmark + self-scan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/breakoutsolutions/audit-tool:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Benchmark (recall/precision gate)
        run: npm run benchmark

      - name: Self-scan (must be clean)
        # Scans this repo statically using the built tool.
        # benchmark/corpus/** and benchmark/live-fixture/** are excluded via
        # .semgrepignore and .gitleaksignore (checked-in, not ad-hoc).
        # Exits 2 if any high-or-above finding is detected.
        run: node dist/cli.js run --repo audit-tool --fail-on high
