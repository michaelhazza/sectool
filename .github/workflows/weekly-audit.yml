name: Weekly portfolio audit

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Full portfolio scan (static + live staging)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 20 actions deprecated June 16 2026
      AUDIT_GITHUB_READ_TOKEN: ${{ secrets.AUDIT_GITHUB_READ_TOKEN }}
      AUDIT_STAGING_AUTOMATION_USER_A: ${{ secrets.AUDIT_STAGING_AUTOMATION_USER_A }}
      AUDIT_STAGING_AUTOMATION_PASS_A: ${{ secrets.AUDIT_STAGING_AUTOMATION_PASS_A }}
      AUDIT_STAGING_AUTOMATION_USER_B: ${{ secrets.AUDIT_STAGING_AUTOMATION_USER_B }}
      AUDIT_STAGING_AUTOMATION_PASS_B: ${{ secrets.AUDIT_STAGING_AUTOMATION_PASS_B }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scanner image
        run: docker build -t audit-tool:weekly .

      - name: Portfolio audit (all enabled repos + staging targets)
        # Static scan of all registered repos + live DAST against allowlisted
        # staging hosts only. All live traffic is gated by config/allowed-staging-hosts.json.
        # Secrets are passed via --env so they are available inside the container.
        run: |
          # Container runs as non-root USER audit — make the bind-mounted reports dir writable.
          mkdir -p reports && chmod 777 reports
          docker run --rm \
            -e AUDIT_GITHUB_READ_TOKEN \
            -e AUDIT_STAGING_AUTOMATION_USER_A \
            -e AUDIT_STAGING_AUTOMATION_PASS_A \
            -e AUDIT_STAGING_AUTOMATION_USER_B \
            -e AUDIT_STAGING_AUTOMATION_PASS_B \
            -v "${{ github.workspace }}/reports:/app/reports" \
            audit-tool:weekly \
            run

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Set up Node 20 (for uploader)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload report to dashboard (scheduled)
        continue-on-error: true
        env:
          FLY_UPLOAD_URL: ${{ secrets.FLY_UPLOAD_URL }}
          AUDIT_UPLOAD_TOKEN: ${{ secrets.AUDIT_UPLOAD_TOKEN }}
          # GITHUB_RUN_ID, GITHUB_WORKFLOW_REF, GITHUB_SHA are set automatically by Actions
          # GITHUB_WORKFLOW_REF contains the workflow file path, used for server-side
          # provenance verification (C6) — matched by path/id, not mutable display name.
        run: |
          node ci/upload-report.mjs scheduled
